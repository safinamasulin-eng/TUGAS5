<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencarian Profil GitHub</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f6f8fa; display: flex; justify-content: center; padding: 30px 15px; margin: 0; }
    .container { background: white; width: 100%; max-width: 500px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { text-align: center; font-size: 22px; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #666; font-size: 14px; margin-top: 0; }
    form { display: flex; gap: 10px; margin: 20px 0; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    button { padding: 12px 18px; background: #24292f; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button:hover { background: #000; }
    #loading { display: none; text-align: center; color: #555; margin: 15px 0; }
    #error { display: none; text-align: center; background: #ffebe9; color: #cf222e; padding: 12px; border-radius: 8px; margin-top: 10px; }
    #result { display: none; text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
    #result img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #eee; }
    #result h2 { margin: 12px 0 5px; }
    #result p { color: #555; margin: 5px 0; }
    .repo { display: inline-block; background: #ddf4ff; color: #0969da; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; margin: 10px 0; }
    a.profil { display: inline-block; margin-top: 10px; color: white; background: #2da44e; padding: 10px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    a.profil:hover { background: #218739; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Pencarian Profil GitHub</h1>
    <p class="subtitle">Masukkan username GitHub untuk melihat profilnya</p>

    <form id="searchForm">
      <input type="text" id="username" placeholder="Contoh: octocat" required>
      <button type="submit">Cari</button>
    </form>

    <div id="loading">⏳ Sedang memuat...</div>
    <div id="error"></div>

    <div id="result">
      <img id="avatar" src="" alt="Avatar">
      <h2 id="name"></h2>
      <p id="bio"></p>
      <div class="repo" id="repos"></div>
      <br>
      <a id="profileLink" class="profil" href="#" target="_blank">Lihat Profil GitHub</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('searchForm');
    const usernameInput = document.getElementById('username');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const resultEl = document.getElementById('result');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = usernameInput.value.trim();
      if (!username) return;

      // Reset tampilan
      resultEl.style.display = 'none';
      errorEl.style.display = 'none';
      loadingEl.style.display = 'block';

      try {
        const response = await fetch(`https://api.github.com/users/${username}`);

        // Kondisi 404 - User tidak ditemukan
        if (response.status === 404) {
          throw new Error('User tidak ditemukan');
        }

        if (!response.ok) {
          throw new Error('Terjadi kesalahan saat mengambil data');
        }

        const data = await response.json();

        // Tampilkan data
        document.getElementById('avatar').src = data.avatar_url;
        document.getElementById('name').textContent = data.name || data.login;
        document.getElementById('bio').textContent = data.bio || 'Tidak ada bio';
        document.getElementById('repos').textContent = `📦 ${data.public_repos} Repositori Publik`;
        document.getElementById('profileLink').href = data.html_url;

        resultEl.style.display = 'block';

      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        loadingEl.style.display = 'none';
      }
    });
  </script>

</body>
</html>
